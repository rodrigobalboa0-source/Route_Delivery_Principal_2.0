<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RouteDelivery Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .sidebar-link { @apply flex items-center gap-2 px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors text-sm; }
    .sidebar-link.active { @apply bg-sky-600 text-white; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-slate-800 min-h-screen flex flex-col flex-shrink-0">
    <div class="px-4 py-5 border-b border-slate-700">
      <span class="text-white font-bold text-lg">RouteDelivery</span>
      <span class="text-sky-400 text-xs block">Admin Panel</span>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="/admin-panel" class="sidebar-link {% if request.url.path == '/admin-panel' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/admin" class="sidebar-link">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        Tabelas (SQLAdmin)
      </a>
      <a href="/admin-panel/auth-users" class="sidebar-link {% if '/admin-panel/auth-users' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Usuários Auth
      </a>
      <a href="/admin-panel/storage" class="sidebar-link {% if '/admin-panel/storage' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
        Storage
      </a>
      <a href="/admin-panel/sql" class="sidebar-link {% if '/admin-panel/sql' in request.url.path %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        SQL Editor
      </a>
    </nav>
    <div class="p-3 border-t border-slate-700">
      <a href="/admin/logout" class="sidebar-link text-red-400 hover:text-red-300 hover:bg-red-900/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col min-h-screen">
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
      <h1 class="text-slate-800 font-semibold">{% block heading %}{% endblock %}</h1>
      <span class="text-xs text-slate-400">RouteDelivery Self-Hosted</span>
    </header>
    <div class="flex-1 p-6">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
