server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # SQLAdmin panel (dashboard, tabelas, storage, sql editor, auth users)
    location ~ ^/(admin|admin-panel)(/|$) {
        proxy_pass http://routedelivery-sqladmin:4000;
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used -- $host é a variável recomendada pela doc do Nginx (normalizada a partir do server_name), ao contrário de $http_host que reflete o header bruto do cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Proxy Supabase API via Kong
    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used -- $host é a variável recomendada pela doc do Nginx (normalizada a partir do server_name), ao contrário de $http_host que reflete o header bruto do cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- upgrade necessário para WebSocket do Supabase Realtime; proxy_pass aponta só para o Kong interno da rede docker, não há backend externo pra contrabandear tráfego H2C
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Maps API própria (carbymaps) — processo Node no host, porta 3000
    location /maps-api/ {
        proxy_pass http://host.docker.internal:3000/;
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used -- $host é a variável recomendada pela doc do Nginx (normalizada a partir do server_name), ao contrário de $http_host que reflete o header bruto do cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # React SPA — index.html não pode ficar em cache do navegador (é ele que
    # referencia o JS/CSS com hash do build atual); os arquivos hasheados em
    # /assets/ continuam com cache padrão do nginx, que é seguro pra eles.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

server {
    listen 443 ssl;
    server_name routedeelivery.com www.routedeelivery.com;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/routedeelivery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routedeelivery.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SQLAdmin panel (dashboard, tabelas, storage, sql editor, auth users)
    location ~ ^/(admin|admin-panel)(/|$) {
